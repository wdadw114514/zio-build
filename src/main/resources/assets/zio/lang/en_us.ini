;[descriptions.settings.<module-config-name>]
;<setting-config-name>=<description>
;
;Example:
;[descriptions.settings]
;AutoCrystal.Await=test
[descriptions.settings]
AutoCrystal.DamageRatio="The minimum damage ratio permitted between you and the enemy."
AutoCrystal.Sequential="Strict - will place right after the explosion packet, skipping the next one. \nStrong - will spam-place after every explosion packet."
AutoCrystal.LowerHitBox="Will try to place under the enemy if possible."
AutoCrystal.MineIgnore="Will ignore the block you are currently mining during the calculations (just before it's broken)."
AutoCrystal.Always="Will ignore min damages during MineIgnore."
AutoCrystal.Threshold="Amount of ticks before the block is considered already broken."
AutoCrystal.Factor="Amount of break packets sent per 1 crystal (ID predict)."
AutoCrystal.Await="Dynamic delay (ping sync)."
AutoCrystal.Extrapolation="Movement prediction (in ticks)."
AutoCrystal.Multipoint="Divides the block into sections to click the closest one."
Aura.ExtraRange="Exploits Minecraft's pose system to hit further. \n<yellow>GrimAC only."
Aura.Magnet="Changes the enemy's velocity to push them towards you."
Blocker.BlockDamage="Amount of damage needed for the block to be considered unsafe."
AntiCheat.2b2t="Uses necessary exploits and limitations needed for Zio to work on 2b2t.org."
AntiCheat.Limiter="Limits the amount of packets sent to prevent kicks."
AntiCheat.NoServerSlot="Prevents the server from forcing an item into your selected slot."
AntiCheat.StrictDirection="Will make placement modules only click on visible sides of the block."
AntiCheat.Placements="Placement limitations for different server cores."
ElytraFly.Responsive="Makes ascending/descending easier by manipulating your pitch when you jump/sneak."
ElytraFly.ResponsiveDescend="Pauses ElytraFly while you're sneaking."
ElytraFly.NCPBoost="Exploits NCP elytra checks to make you fly extra fast."
ElytraFly.Factorize="Only boosts when possible in vanilla."
ElytraFly.Auto="Makes you bounce faster by manipulating your pitch."
Velocity.Reduce="Reduces the amount of packets sent."
Velocity.Static="Makes Reduce also work when standing still."
Fireworks.FastLaunch="Makes you take-off with an elytra instantly when you use a firework."
SpeedMine.Async="Spams break packets to re-mine as fast as possible."
EntityControl.GrimOverflow="Abuses ViaVersion and Grim entity packets. \n<red>Requires Via protocol version set to 1.20.6 or below."