[descriptions.settings]
AutoCrystal.DamageRatio=你和敌人之间允许的最小伤害比例。
AutoCrystal.Sequential=严格 - 会在爆炸数据包之后立即放置，跳过下一个。\n强力 - 每次爆炸数据包后都会连续放置。
AutoCrystal.LowerHitBox=如果可能，会尝试放置在敌人下方。
AutoCrystal.MineIgnore=计算时会忽略你正在挖掘的方块（就在它被破坏前）。
AutoCrystal.Always=在 MineIgnore 期间忽略最小伤害。
AutoCrystal.Threshold=方块被视为已破坏前所需的刻数。
AutoCrystal.Factor=每 1 个水晶发送的破坏数据包数量（ID 预测）。
AutoCrystal.Await=动态延迟（延迟同步）。
AutoCrystal.Extrapolation=移动预测（单位：刻）。
AutoCrystal.Multipoint=将方块分成若干区域，点击最近的一个。
Aura.ExtraRange=利用 Minecraft 的姿势系统打得更远。\n<yellow>仅限 GrimAC。
Aura.Magnet=改变敌人的速度，将其推向你。
Blocker.BlockDamage=方块被视为不安全所需的伤害值。
AntiCheat.2b2t=使用在 2b2t.org 上运行 Zio 所需的漏洞利用与限制。
AntiCheat.Limiter=限制发送的数据包数量以防止被踢。
AntiCheat.NoServerSlot=防止服务器强制把物品放入你选中的槽位。
AntiCheat.StrictDirection=使放置模块只点击方块的可见面。
AntiCheat.Placements=针对不同服务端核心的放置限制。
ElytraFly.Responsive=在你跳跃/潜行时调整俯仰角，使上升/下降更容易。
ElytraFly.ResponsiveDescend=在你潜行时暂停鞘翅飞行。
ElytraFly.NCPBoost=利用 NCP 的鞘翅检测让你飞得更快。
ElytraFly.Factorize=仅在原版可行的条件下加速。
ElytraFly.Auto=通过调整俯仰角让你弹跳得更快。
Velocity.Reduce=减少发送的数据包数量。
Velocity.Static=使 Reduce 在静止时也生效。
Fireworks.FastLaunch=使用烟花时立即用鞘翅起飞。
SpeedMine.Async=连续发送破坏数据包，以最快速度重新挖掘。
EntityControl.GrimOverflow=滥用 ViaVersion 与 Grim 实体数据包。\n<red>需要将 Via 协议版本设为 1.20.6 或更低。

